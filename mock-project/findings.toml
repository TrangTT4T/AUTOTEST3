# Findings register: defects found in the system under test, per persona.
#
# A finding names the PERSONAS it affects and the AREA (behaviour) it breaks. A scenario
# declares the behaviours it depends on with @area-<name> tags. When the suite runs as one of
# the affected personas, every scenario with that area becomes a STRICT expected failure
# (xfail, strict=True, raises=AssertionError):
#   * the defect still fails the scenario  -> XFAIL, the run stays green, the matrix says KNOWN DEFECT;
#   * the defect has been fixed            -> XPASS, the run goes RED: update this register;
#   * it fails in another way (timeout, crash in our code) -> FAILED, the run goes RED.
#
# Full reports with reproduction steps: docs/03-findings.md. Every id here must appear there.

[areas]
catalogue-images = "Each catalogue card shows its own product image"
catalogue-prices = "The price on a catalogue card is the product's real price"
sorting = "Choosing a sort order re-orders the catalogue without errors"
add-any-product = "Every product (not only the first few) can be added from the catalogue"
remove-from-catalogue = "Remove buttons on the catalogue page take products out of the cart"
product-links = "A catalogue card opens its own product page"
last-name-entry = "Text typed into the Last Name field stays there"
last-name-required = "Checkout refuses an empty Last Name"
finish-order = "The Finish button completes the order"
response-time = "Interactions finish within their time budgets"
reset-state = "Reset App State updates the page it was used on"

