name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      blazedemo:
        description: "Also run the light BlazeDemo load test (5 users, 2 minutes)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"   # nightly live regression, 03:17 UTC

permissions:
  contents: read           # nothing in CI writes to the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JMETER_VERSION: "5.6.3"
  # SHA-512 published by Apache for apache-jmeter-5.6.3.tgz: a download that does not match never runs.
  JMETER_SHA512: "5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083"

jobs:
  quality:
    name: Lint, types, unit tests, offline BDD, cloud config audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: BDD review (step usage, ambiguity, Gherkin smells, coverage)
        run: python -m framework.review --strict
      - name: Unit, offline BDD, and events-sandbox tests (parallel); requirement and code coverage gates
        run: pytest --store fake -n auto --fail-on-uncovered --cov --cov-report=term --cov-report=xml:reports/coverage.xml
      - name: "Oracle validation: events tests must all pass against the fixed sandbox build"
        run: pytest --store fake tests/events tests/test_order_events.py -n auto --sandbox-build fixed
      - name: CloudFormation lint (reference templates)
        run: cfn-lint cloud/cloudformation/test-execution.yaml cloud/cloudformation/device-farm.yaml
      - name: Workflow lint
        run: actionlint .github/workflows/ci.yml .github/workflows/cloud.yml
      - name: Cloud configuration audit (policy as code), fail on high
        run: python -m framework.cloud.audit cloud .github/workflows --fail-on high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-reports
          path: reports/

  container:
    name: Container image - build, run the offline suite read-only
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f docker/Dockerfile -t shop-bdd-tests:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} .
      - name: Run as on Fargate (read-only root, non-root user, writable reports and /tmp only)
        run: |
          mkdir -p archive && chmod 777 archive
          docker run --rm --read-only --tmpfs /tmp --tmpfs /app/reports:uid=10001 \
            -v "$PWD/archive:/archive" -e RUN_ID=ci-${{ github.run_id }} \
            shop-bdd-tests:${{ github.sha }} --suite offline --artifacts /archive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-run-artifacts
          path: archive/

  performance:
    name: Performance - sandbox smoke load + SLA gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v6
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}
      - name: Download and verify JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          echo "${JMETER_SHA512}  jmeter.tgz" | sha512sum -c -
          tar xzf jmeter.tgz
      - name: Start the order-events sandbox (system under load)
        run: |
          mkdir -p reports/perf
          python -m sandbox --port 8765 --log reports/perf/sandbox.log > reports/perf/sandbox.out 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
      - name: Load test with telemetry (5 users, 30 s)
        run: |
          python -m framework.perf.telemetry http://127.0.0.1:8765 --out reports/perf/telemetry.csv --duration 40 &
          "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n -t perf/orders_sandbox.jmx -q perf/jmeter.properties \
            -l reports/perf/orders.jtl -e -o reports/perf/orders-html \
            -Jusers=5 -Jrampup=5 -Jduration=30 -Jrun=ci-${{ github.run_id }}
          wait
      - name: Bottleneck report (load vs telemetry)
        run: python -m framework.perf.correlate reports/perf/orders.jtl reports/perf/telemetry.csv
      - name: SLA gate
        run: python -m framework.perf.gate reports/perf/orders.jtl --profile sandbox
      - name: "Load profile (CT-PT ch. 4): ramp-up 10 s, steady 30 s, ramp-down 10 s, operational mix"
        run: |
          python -m framework.perf.model perf/workload.toml >> "$GITHUB_STEP_SUMMARY"
          "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n -t perf/orders_sandbox_profile.jmx -q perf/jmeter.properties \
            -l reports/perf/profile.jtl -e -o reports/perf/profile-html \
            -Jrampup=10 -Jsteady=30 -Jrampdown=10 -Jrun=ci-profile-${{ github.run_id }}
      - name: Load-profile gate (steady state only)
        run: |
          python -m framework.perf.gate reports/perf/profile.jtl --profile sandbox_profile \
            --skip-head 10 --skip-tail 10 --timeline-label "J2 Check order status"
          cat reports/perf/gate-sandbox_profile.md >> "$GITHUB_STEP_SUMMARY"
      - name: Light BlazeDemo journey (manual runs only - someone else's site)
        if: github.event_name == 'workflow_dispatch' && inputs.blazedemo
        run: |
          "apache-jmeter-${JMETER_VERSION}/bin/jmeter" -n -t perf/blazedemo_purchase.jmx -q perf/jmeter.properties \
            -l reports/perf/blazedemo.jtl -e -o reports/perf/blazedemo-html -Jusers=5 -Jduration=120
          python -m framework.perf.gate reports/perf/blazedemo.jtl --profile blazedemo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-reports
          path: reports/perf/
          retention-days: 14

  live:
    name: Live store (${{ github.event_name == 'schedule' && 'regression' || 'smoke' }})
    needs: quality
    # Live runs hit a shared third-party site: only on main, on schedule, or on demand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: "Run against the live store (serial on purpose: low load)"
        run: >
          pytest tests/test_*.py tests/e2e ${{ github.event_name == 'schedule' && 'tests/pages' || '' }}
          -m "${{ github.event_name == 'schedule' && 'not manual' || 'smoke or p1' }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-reports
          path: reports/
          retention-days: 14
