AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  shop-bdd test execution on AWS (Unit 4 reference design, NOT deployed by the course):
  ECR repository, encrypted S3 artifact bucket with expiry, CloudWatch log group with retention,
  ECS cluster and Fargate task definition (read-only root, non-root user), least-privilege roles,
  GitHub OIDC role for CI, and a monthly budget alarm. No NAT gateway: tasks run in public
  subnets with a public IP and no inbound rules.

Parameters:
  ProjectName:
    Type: String
    Default: shop-bdd
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the test tasks (the default VPC is fine for a lab).
  GitHubRepository:
    Type: String
    Description: owner/repository allowed to use the CI role, e.g. my-org/shop-bdd
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: aws-lab
    Description: GitHub environment (with required reviewers) that gates every cloud run.
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: The provider exists once per account; choose false if it already exists.
  ImageTag:
    Type: String
    Default: bootstrap
    Description: Immutable image tag (the git commit) the task definition runs.
  ArtifactRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
  AlertEmail:
    Type: String
    Description: Receives budget alerts.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ------------------------------------------------------------------ artifacts (S3)
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-test-runs
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: !Ref ArtifactRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: !Ref ProjectName

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub "${ArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ------------------------------------------------------------------ images (ECR)
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-tests"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep the last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # ------------------------------------------------------------------ telemetry (CloudWatch)
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-tests"
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------ execution (ECS/Fargate)
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-tests"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled # per-task CPU/memory metrics for standalone tasks; billed as custom metrics
      Tags:
        - Key: project
          Value: !Ref ProjectName

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Test tasks - no inbound traffic, HTTPS out only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: ECR, S3, CloudWatch Logs, and the systems under test (HTTPS)

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Description: Used by ECS itself to pull the image and write logs - not by the tests.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Description: Used by the test code - may only write this run's artifacts.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: write-run-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${ArtifactsBucket.Arn}/runs/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-tests"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: reports
        - Name: tmp
      ContainerDefinitions:
        - Name: tests
          Image: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          Essential: true
          User: "10001"
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          MountPoints:
            - SourceVolume: reports
              ContainerPath: /app/reports
            - SourceVolume: tmp
              ContainerPath: /tmp
          Environment:
            - Name: SUITE
              Value: offline
            - Name: ARTIFACTS
              Value: !Sub "s3://${ArtifactsBucket}/runs"
            - Name: IMAGE_TAG
              Value: !Ref ImageTag
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: run

  # ------------------------------------------------------------------ CI identity (GitHub OIDC)
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  CiRole:
    Type: AWS::IAM::Role
    Description: Assumed by GitHub Actions in one repository and one environment only.
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: run-tests-on-fargate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                Resource: !GetAtt Repository.Arn
              - Sid: TaskDefinitionRevisions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: RunTasksInThisClusterOnly
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-tests:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Sid: WatchAndStopOwnTasks
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*"
              - Sid: PassOnlyTheTwoTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ReadRunLogs
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: !Sub "${LogGroup.Arn}"
              - Sid: ReadRunArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactsBucket.Arn}/runs/*"
              - Sid: ListRunArtifacts
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "runs/*"
              - Sid: ReadMetricsForEvidence
                Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: "*"

  # ------------------------------------------------------------------ cost control
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-tests-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  SecurityGroupId:
    Value: !Ref RunnerSecurityGroup
  LogGroupName:
    Value: !Ref LogGroup
  CiRoleArn:
    Value: !GetAtt CiRole.Arn
